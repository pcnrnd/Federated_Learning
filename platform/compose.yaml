# 연합컴퓨팅 플랫폼 — 통합 기동 (Phase 0)
#
# 구 구성은 파일이 둘로 갈라져 있었고 두 지점이 깨져 있었다:
#   1) 저장소 루트 compose.fed-platform.yaml → 존재하지 않는 `app/Dockerfile` 참조
#   2) silo/compose.silo.yaml 의 `fed-net` 에 name/external 미지정 → 실제 이름이
#      `<프로젝트>_fed-net` 이 되어 백엔드·대시보드가 같은 망에 붙지 못했다
# 본 파일이 둘을 대체한다. 원본 두 파일은 무수정 보존(참조용).
#
# 기동:   docker compose up -d --build          (platform/ 에서 실행)
# 사일로 워커: ./backend/scripts 를 /opt/silo_scripts 로 읽기 전용 마운트한다 — docker cp 없이
#         `docker exec silo-N python3 /opt/silo_scripts/silo_worker.py <모드> ...`. 수집기(monitor)는
#         entrypoint 가 기동 때 자동 시작하고 죽으면 10초 뒤 다시 띄운다(FED_MONITOR_AUTOSTART=0 이면 끔).
# 종료:   docker compose down
# 포트:   FED_PLATFORM_PORT(기본 8000), 사일로 SSH 2223~2228 / Docker API 2371~2376
#         MinIO 7001~7012 (각 사일로 내부 MinIO의 9000/9001 매핑)
#
# MinIO 는 사일로마다 DinD 안에서 기동된다 — entrypoint.siloN.sh 가 컨테이너 내부에서
# compose.minio.siloN.yaml 을 up 한다. 사일로별 데이터 격리(named volume siloN-data)를
# 유지하기 위한 기존 설계이므로 최상위 서비스로 끌어내지 않았다.

# 사일로 공통 환경 — 워커·수집기(monitor)가 쓴다. FED_ALIGN_KEY(사일로 간 수직 정렬 공유 키)는
# 사일로에만 준다 — 백엔드에는 두지 않는다 (서버가 HMAC 다이제스트를 id로 되돌릴 수 없게).
x-silo-env: &silo-env
  FED_CENTRAL: http://fed-backend:8000
  FED_API_KEY: ${FED_API_KEY:-}
  FED_SILO_DATA_DIR: /srv/silo-data # 로컬 원천 파일 (컨테이너 안, 사일로 밖으로 나가지 않음)
  FED_ALIGN_KEY: ${FED_ALIGN_KEY:-}
  FED_MONITOR_AUTOSTART: ${FED_MONITOR_AUTOSTART:-1} # 1이면 기동 때 수집기 자동 시작
  FED_CLEANING_AUTOSTART: ${FED_CLEANING_AUTOSTART:-1} # 예약 정제 pull worker
x-silo-env-1: &silo-env-1
  <<: *silo-env
  FED_SILO_ID: silo-1
x-silo-env-2: &silo-env-2
  <<: *silo-env
  FED_SILO_ID: silo-2
x-silo-env-3: &silo-env-3
  <<: *silo-env
  FED_SILO_ID: silo-3
x-silo-env-4: &silo-env-4
  <<: *silo-env
  FED_SILO_ID: silo-4
x-silo-env-5: &silo-env-5
  <<: *silo-env
  FED_SILO_ID: silo-5
x-silo-env-6: &silo-env-6
  <<: *silo-env
  FED_SILO_ID: silo-6

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: fed-platform-backend:local
    container_name: fed-backend
    ports:
      - "${FED_PLATFORM_PORT:-8000}:8000"
    environment:
      FED_CONFIG_DIR: /srv/config
      FED_API_KEY: ${FED_API_KEY:-}
      FED_STORAGE: ${FED_STORAGE:-yaml}
      # 라운드 자동 집계/잡 진행 tick 간격(초) — 연속 라운드 실측 시 단축 가능
      FED_SCHEDULER_INTERVAL: ${FED_SCHEDULER_INTERVAL:-15}
    volumes:
      - ./config:/srv/config
      # 패키징/배포 라우터가 호스트 Docker 데몬을 제어해야 할 때만 주석 해제
      # - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - fed-net
    depends_on:
      - silo-1
      - silo-2
      - silo-3
      - silo-4
      - silo-5
      - silo-6
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  silo-1:
    build:
      context: ./silo
      dockerfile: Dockerfile.silo1
    container_name: silo-1
    privileged: true # Docker-in-Docker 실행 권한 (내부 MinIO 기동에 필요)
    ports:
      - "2223:22" # SSH
      - "2371:2375" # Docker API
      - "7001:9000" # MinIO API
      - "7002:9001" # MinIO Console
    volumes:
      # 사일로 전용 저장소 (데이터 격리). 호스트 바인드(./data/siloN)가 아닌 named volume을
      # 쓰는 이유: 내부 dockerd의 데이터 루트가 drvfs/9p(Windows 마운트) 위에 놓이면
      # containerd 스냅샷 마운트 콜백(/dev/shm 등 생성)이 실패해 MinIO가 뜨지 못한다.
      - silo1-data:/var/lib/docker
      - silo1-learning-data:/srv/silo-data # 배포 전 기존 writable-layer 원천/결과의 보존 이전 필요
      - ./backend/silo_sdk:/opt/silo_sdk:ro # PYTHONPATH=/opt → `import silo_sdk`
      - ./backend/scripts:/opt/silo_scripts:ro # silo_worker.py — docker cp 없이 재기동만으로 최신 워커
    environment: *silo-env-1
    networks:
      - fed-net

  silo-2:
    build:
      context: ./silo
      dockerfile: Dockerfile.silo2
    container_name: silo-2
    privileged: true
    ports:
      - "2224:22"
      - "2372:2375"
      - "7003:9000"
      - "7004:9001"
    volumes:
      - silo2-data:/var/lib/docker # named volume 사유는 silo-1 참조
      - silo2-learning-data:/srv/silo-data
      - ./backend/silo_sdk:/opt/silo_sdk:ro
      - ./backend/scripts:/opt/silo_scripts:ro
    environment: *silo-env-2
    networks:
      - fed-net

  silo-3:
    build:
      context: ./silo
      dockerfile: Dockerfile.silo3
    container_name: silo-3
    privileged: true
    ports:
      - "2225:22"
      - "2373:2375"
      - "7005:9000"
      - "7006:9001"
    volumes:
      - silo3-data:/var/lib/docker # named volume 사유는 silo-1 참조
      - silo3-learning-data:/srv/silo-data
      - ./backend/silo_sdk:/opt/silo_sdk:ro
      - ./backend/scripts:/opt/silo_scripts:ro
    environment: *silo-env-3
    networks:
      - fed-net

  silo-4:
    build:
      context: ./silo
      dockerfile: Dockerfile.silo4
    container_name: silo-4
    privileged: true
    ports:
      - "2226:22"
      - "2374:2375"
      - "7007:9000"
      - "7008:9001"
    volumes:
      - silo4-data:/var/lib/docker # named volume 사유는 silo-1 참조
      - silo4-learning-data:/srv/silo-data
      - ./backend/silo_sdk:/opt/silo_sdk:ro
      - ./backend/scripts:/opt/silo_scripts:ro
    environment: *silo-env-4
    networks:
      - fed-net

  silo-5:
    build:
      context: ./silo
      dockerfile: Dockerfile.silo5
    container_name: silo-5
    privileged: true
    ports:
      - "2227:22"
      # 호스트 2375는 dockerd 관례 TCP 포트와 겹친다 — 호스트 dockerd가 TCP를 열지 않는 WSL 기본
      # 구성에서만 충돌 없음. 현행 유지 (docs/research-notes/2026-H2.md L4). 충돌 시 이 줄의 호스트
      # 포트를 바꾸고 config/servers.yaml silo-5 base_url·README/AGENTS 포트표를 함께 갱신해야 한다.
      - "2375:2375"
      - "7009:9000"
      - "7010:9001"
    volumes:
      - silo5-data:/var/lib/docker # named volume 사유는 silo-1 참조
      - silo5-learning-data:/srv/silo-data
      - ./backend/silo_sdk:/opt/silo_sdk:ro
      - ./backend/scripts:/opt/silo_scripts:ro
    environment: *silo-env-5
    networks:
      - fed-net

  silo-6:
    build:
      context: ./silo
      dockerfile: Dockerfile.silo6
    container_name: silo-6
    privileged: true
    ports:
      - "2228:22"
      - "2376:2375"
      - "7011:9000"
      - "7012:9001"
    volumes:
      - silo6-data:/var/lib/docker # named volume 사유는 silo-1 참조
      - silo6-learning-data:/srv/silo-data
      - ./backend/silo_sdk:/opt/silo_sdk:ro
      - ./backend/scripts:/opt/silo_scripts:ro
    environment: *silo-env-6
    networks:
      - fed-net

networks:
  fed-net:
    name: fed-net # 프로젝트명 접두어 없이 고정 — 외부 compose가 external로 붙을 수 있다
    driver: bridge

volumes:
  silo1-data:
  silo2-data:
  silo3-data:
  silo4-data:
  silo5-data:
  silo6-data:
  silo1-learning-data:
  silo2-learning-data:
  silo3-learning-data:
  silo4-learning-data:
  silo5-learning-data:
  silo6-learning-data:
