# GitHub Actions 워크플로우 (템플릿)
#
# 사용법:
#   1. 본 파일을 저장소 루트의 `.github/workflows/ci.yml` 로 복사한다.
#   2. main 브랜치/PR에 대해 자동 실행된다.
#   3. 필요시 Python 버전, 단계 활성화/비활성화를 조정.

name: ci

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'app/**'

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: pytest + coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi 'uvicorn[standard]' docker jinja2 'PyYAML>=6.0' 'pydantic>=2.0'
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -q

      - name: Smoke — probe / dashboard / API Key
        if: matrix.python-version == '3.12'
        run: |
          python -m pytest \
            tests/test_runtime_operations.py \
            tests/test_dashboard_e2e.py \
            tests/test_api_auth_integration.py \
            -q

      - name: Upload coverage to artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: app/coverage.xml

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: pip install 'ruff>=0.5.0'

      - name: Lint
        run: ruff check . --output-format=github

      - name: Format check
        run: ruff format --check .
