# fed-flower-poc-20261021: internal bridge, no host ports, owned tags only.

name: fed-flower-poc-20261021

networks:
  fed_flower_poc_20261021_internal:
    driver: bridge
    internal: true

volumes:
  silo1_learning:
    external: true
    name: fed-g7-c5-46da30-silo-1-learning

services:
  superlink:
    image: fed-flower-poc-20261021-app:1.41.0
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fed-flower-poc-20261021-superlink
    networks: [fed_flower_poc_20261021_internal]
    entrypoint: ["flower-superlink"]
    command:
      - --insecure
      - --host
      - 0.0.0.0
      - --disable-runtime-dependency-installation
    environment:
      FLWR_DISABLE_RUNTIME_DEPENDENCY_INSTALLATION: "1"
    mem_limit: 512m
    cpus: "1.0"
    volumes:
      - type: bind
        source: ${POC_OUTPUT_DIR:?set POC_OUTPUT_DIR to an existing host output directory}
        target: /output

  supernode:
    image: fed-flower-poc-20261021-app:1.41.0
    container_name: fed-flower-poc-20261021-supernode
    networks: [fed_flower_poc_20261021_internal]
    depends_on: [superlink]
    entrypoint: ["flower-supernode"]
    command:
      - --insecure
      - --superlink
      - superlink:8000
      - --host
      - "0.0.0.0"
    mem_limit: 512m
    cpus: "1.0"
    volumes:
      - type: volume
        source: silo1_learning
        target: /srv/silo-data
        read_only: true
    environment:
      FLWR_DISABLE_RUNTIME_DEPENDENCY_INSTALLATION: "1"
      SILO1_DATA_ROOT: /srv/silo-data
      SILO1_ROWS_SHA256: "8164fad0f8a29f18c677a99ad7e791b76e3c318dc15569d27bd2ea5432837356"
