# fed-flower-six-silos-20261021: internal bridge, no host ports, six SuperNodes.

name: fed-flower-six-silos-20261021

networks:
  fed_flower_six_silos_internal:
    driver: bridge
    internal: true

volumes:
  silo1_learning:
    external: true
    name: fed-g7-c5-46da30-silo-1-learning
  silo2_learning:
    external: true
    name: fed-g7-c5-46da30-silo-2-learning
  silo3_learning:
    external: true
    name: fed-g7-c5-46da30-silo-3-learning
  silo4_learning:
    external: true
    name: fed-g7-c5-46da30-silo-4-learning
  silo5_learning:
    external: true
    name: fed-g7-c5-46da30-silo-5-learning
  silo6_learning:
    external: true
    name: fed-g7-c5-46da30-silo-6-learning

x-supernode: &supernode_base
  image: fed-flower-six-silos-20261021-app:1.41.0
  networks: [fed_flower_six_silos_internal]
  depends_on: [superlink]
  entrypoint: ["flower-supernode"]
  command:
    - --insecure
    - --superlink
    - superlink:8000
    - --host
    - "0.0.0.0"
  mem_limit: 512m
  cpus: "1.0"
  environment:
    FLWR_DISABLE_RUNTIME_DEPENDENCY_INSTALLATION: "1"

services:
  superlink:
    image: fed-flower-six-silos-20261021-app:1.41.0
    build:
      context: ../..
      dockerfile: flower_multisilo/docker/Dockerfile
    container_name: fed-flower-six-silos-20261021-superlink
    networks: [fed_flower_six_silos_internal]
    entrypoint: ["flower-superlink"]
    command:
      - --insecure
      - --host
      - 0.0.0.0
      - --disable-runtime-dependency-installation
    environment:
      FLWR_DISABLE_RUNTIME_DEPENDENCY_INSTALLATION: "1"
    mem_limit: 512m
    cpus: "1.0"
    volumes:
      - type: bind
        source: ${POC_OUTPUT_DIR:?set POC_OUTPUT_DIR to an existing host output directory}
        target: /output

  supernode1:
    <<: *supernode_base
    container_name: fed-flower-six-silos-20261021-supernode1
    volumes:
      - type: volume
        source: silo1_learning
        target: /srv/silo-data
        read_only: true
    environment:
      FLWR_DISABLE_RUNTIME_DEPENDENCY_INSTALLATION: "1"
      SILO_ID: "1"
      SILO_DATA_ROOT: /srv/silo-data
      SILO_ROWS_REL: fed-final-path603396-20261021/.cleaned/f27880259e7c004a83f7515ca6ad70a792ee7cba6d4897a28994c1689f69f939/rows.json
      SILO_ROWS_SHA256: "8164fad0f8a29f18c677a99ad7e791b76e3c318dc15569d27bd2ea5432837356"

  supernode2:
