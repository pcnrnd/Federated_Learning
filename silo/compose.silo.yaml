services:
  # ============================================
  # Silo 1
  # ============================================
  silo-1:
    build:
      context: .
      dockerfile: Dockerfile.silo1
    container_name: silo-1
    privileged: true  # ★ 필수: Docker-in-Docker 실행 권한
    volumes:
      - ./data/silo1:/var/lib/docker # ★ 데이터 격리: Silo 1 전용 저장소
    networks:
      - fed-net

  # ============================================
  # Silo 2
  # ============================================
  silo-2:
    build:
      context: .
      dockerfile: Dockerfile.silo2
    container_name: silo-2
    privileged: true
    volumes:
      - ./data/silo2:/var/lib/docker # ★ 데이터 격리: Silo 2 전용 저장소
    networks:
      - fed-net

  # ============================================
  # Silo 3 ~ 6 (패턴 반복)
  # ============================================
  silo-3:
    build:
      context: .
      dockerfile: Dockerfile.silo3
    container_name: silo-3
    privileged: true
    volumes:
      - ./data/silo3:/var/lib/docker
    networks:
      - fed-net

