# GitHub Actions — fed-platform CI

name: ci

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
      - 'compose.fed-platform.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'app/**'

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: pytest + coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage to artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: app/coverage.xml

  smoke:
    name: probe + dashboard smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Runtime smoke (TestClient)
        run: |
          python -m pytest \
            tests/test_runtime_operations.py \
            tests/test_dashboard_e2e.py \
            tests/test_api_auth_integration.py \
            -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: pip install 'ruff>=0.5.0'

      - name: Lint
        working-directory: app
        run: ruff check . --output-format=github

      - name: Format check
        working-directory: app
        run: ruff format --check .
