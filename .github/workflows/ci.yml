# GitHub Actions — 연합컴퓨팅 플랫폼 CI
#
# 백엔드(platform/backend, FastAPI)와 프론트엔드(platform/, Vite+React) 두 갈래.
# 게이트: pytest(커버리지 ≥80%) · 스모크 · ruff check · tsc · vitest.
# `ruff format --check`는 게이트에서 제외 — 전 파일 일괄 포맷은 diff 추적성을 해치므로
# 별도 결정 후 도입한다 (platform/backend/ci/ruff.toml 참조).

name: ci

on:
  push:
    branches: [main, master]
    paths:
      - 'platform/backend/**'
      - 'platform/src/**'
      - 'platform/package.json'
      - 'platform/package-lock.json'
      - 'platform/tsconfig*.json'
      - 'platform/vite.config.ts'
      - 'platform/compose.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'platform/backend/**'
      - 'platform/src/**'
      - 'platform/package.json'
      - 'platform/package-lock.json'
      - 'platform/tsconfig*.json'
      - 'platform/vite.config.ts'
      - 'platform/compose.yaml'
      - '.github/workflows/ci.yml'

jobs:
  backend-test:
    name: backend pytest + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            platform/backend/requirements.txt
            platform/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            -q

      - name: Upload coverage to artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: platform/backend/coverage.xml

  backend-smoke:
    name: backend probe + dashboard smoke
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      # Preserve the existing status-check name. These three TestClient modules
      # already run in tests/ on both Python versions in backend-test.
      - name: Confirm smoke coverage from backend-test
        run: echo "Runtime operations, dashboard E2E and API auth tests passed in backend-test."

  backend-lint:
    name: backend ruff check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . --output-format=github

  frontend:
    name: frontend typecheck + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test
